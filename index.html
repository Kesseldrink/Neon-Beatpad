<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Audio Beat-Maker</title>

    <!-- Das neue Schlagzeug-Webicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥁</text></svg>">

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 10px;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            font-size: 32px;
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(30, 41, 59, 0.7);
            padding: 15px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        button.play-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        input[type="number"] {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 5px;
            border-radius: 4px;
            outline: none;
        }

        /* Container mit Scroll-Funktion für schmale Bildschirme */
        .grid-container {
            width: 95%;
            max-width: 1000px;
            overflow-x: auto;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: auto repeat(16, 1fr);
            gap: 5px;
            min-width: 700px; /* Damit die Buttons nicht zerquetscht werden */
        }

        .track-label {
            font-weight: bold;
            display: flex;
            align-items: center;
            padding-right: 15px;
            color: #94a3b8;
            white-space: nowrap;
        }

        /* Die einzelnen Step-Buttons */
        .step {
            width: 100%;
            aspect-ratio: 1; /* Macht die Buttons perfekt quadratisch */
            background-color: #334155;
            border: 2px solid #1e293b;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .step.active {
            background-color: #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
        }

        .step.playing {
            border-color: #fde047;
            box-shadow: 0 0 15px #fde047;
            background-color: #fef08a;
        }

        .step.active.playing {
            background-color: #fff;
        }
    </style>
</head>
<body>

    <h1>Beat-Maker 🎧</h1>

    <div class="controls">
        <button class="play-btn" id="playBtn" onclick="togglePlay()">▶ Play</button>
        <div>
            <label for="bpm">BPM (Tempo): </label>
            <input type="number" id="bpm" value="120" min="60" max="200" style="width: 60px;">
        </div>
    </div>

    <!-- Scrollbarer Bereich für das große Raster -->
    <div class="grid-container">
        <div class="grid" id="drumGrid"></div>
    </div>

    <script>
        // --- 1. SETUP & WEISSES RAUSCHEN ---
        let audioCtx;
        let noiseBuffer;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // Wir generieren 2 Sekunden "Weißes Rauschen" (Zufallswerte) für Becken und Snare
                const bufferSize = audioCtx.sampleRate * 2;
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
            }
        }

        // --- 2. DIE SYNTHESIZER-FUNKTIONEN ---

        // Baut Töne auf (für Kick, Toms und den Snare-Körper)
        function playTone(startFreq, endFreq, duration, vol=1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            // Tonhöhe rutscht ab
            osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);

            // Lautstärke wird leiser
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
        }

        // Filtert das Rauschen (für Becken und Snare-Teppich)
        function playNoise(duration, filterType, frequency, vol=1) {
            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = filterType; // "highpass" lässt nur Höhen durch, "bandpass" nur die Mitte
            filter.frequency.value = frequency;

            const gain = audioCtx.createGain();

            noiseSource.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            noiseSource.start(audioCtx.currentTime);
            noiseSource.stop(audioCtx.currentTime + duration);
        }

        // --- 3. DIE INSTRUMENTE ---
        function playCrash() { playNoise(1.5, "bandpass", 4000, 0.9); }
        function playRide()  { playNoise(0.8, "highpass", 6000, 0.4); }
        function playHiHat() { playNoise(0.1, "highpass", 8000, 0.5); }

        function playTom1()  { playTone(250, 50, 0.3, 0.8); } // High Tom
        function playTom2()  { playTone(200, 40, 0.3, 0.8); } // Mid Tom
        function playTom3()  { playTone(150, 30, 0.4, 0.8); } // Low Tom

        function playSnare() {
            playTone(250, 50, 0.15, 0.7);          // Dumpfer Schlag
            playNoise(0.2, "highpass", 2000, 0.6); // Zischender Teppich
        }
        function playKick()  { playTone(150, 0.01, 0.5, 1); }

        // --- 4. RASTER AUFBAUEN ---
        // Von oben (Becken) nach unten (Kick) sortiert wie bei einem echten Drum-Set
        const tracks = ["Crash", "Ride", "Hi-Hat", "Tom 1", "Tom 2", "Tom 3", "Snare", "Bass Drum"];
        const gridElement = document.getElementById("drumGrid");
        const stepsCount = 16;
        let gridData = [];

        for (let i = 0; i < tracks.length; i++) {
            let label = document.createElement("div");
            label.className = "track-label";
            label.innerText = tracks[i];
            gridElement.appendChild(label);

            gridData[i] = [];

            for (let j = 0; j < stepsCount; j++) {
                let btn = document.createElement("div");
                btn.className = "step";
                btn.id = `step-${i}-${j}`;
                gridData[i][j] = false;

                btn.onclick = () => {
                    gridData[i][j] = !gridData[i][j];
                    btn.classList.toggle("active");
                };

                gridElement.appendChild(btn);
            }
        }

        // --- 5. DER SEQUENCER ---
        let isPlaying = false;
        let currentStep = 0;
        let loopInterval;

        function togglePlay() {
            initAudio();

            const playBtn = document.getElementById("playBtn");
            if (isPlaying) {
                clearInterval(loopInterval);
                playBtn.innerText = "▶ Play";
                playBtn.style.background = "linear-gradient(135deg, #10b981, #059669)";
            } else {
                let bpm = document.getElementById("bpm").value;
                let stepTime = (60 / bpm) / 4 * 1000;

                loopInterval = setInterval(playStep, stepTime);
                playBtn.innerText = "⏸ Stop";
                playBtn.style.background = "linear-gradient(135deg, #ef4444, #dc2626)";
            }
            isPlaying = !isPlaying;
        }

        function playStep() {
            document.querySelectorAll(".playing").forEach(el => el.classList.remove("playing"));

            for (let track = 0; track < tracks.length; track++) {
                let stepBtn = document.getElementById(`step-${track}-${currentStep}`);
                stepBtn.classList.add("playing");

                if (gridData[track][currentStep]) {
                    if (tracks[track] === "Crash") playCrash();
                    if (tracks[track] === "Ride") playRide();
                    if (tracks[track] === "Hi-Hat") playHiHat();
                    if (tracks[track] === "Tom 1") playTom1();
                    if (tracks[track] === "Tom 2") playTom2();
                    if (tracks[track] === "Tom 3") playTom3();
                    if (tracks[track] === "Snare") playSnare();
                    if (tracks[track] === "Bass Drum") playKick();
                }
            }
            currentStep = (currentStep + 1) % stepsCount;
        }
    </script>
</body>
</html>
